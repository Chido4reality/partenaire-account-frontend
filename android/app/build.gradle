apply plugin: 'com.android.application'

// MP-SIGNING-PROPS: resolve release-signing credentials from
// android/keystore.properties (gitignored) when present, falling back to the
// MP_KEYSTORE_PASSWORD / MP_KEY_PASSWORD env vars. This removes the dependency
// on pasted shell commands — Git Bash bracketed-paste artifacts (^[[200~) were
// corrupting the env-var exports, so passwords arrived null and
// :app:signReleaseBundle NPE'd at FinalizeBundleTask. Every value coalesces to
// "" so a null can never reach the signer (missing/empty → clear "keystore
// password was incorrect", not a NullPointerException).
def mpKsPropsFile = rootProject.file('keystore.properties')
def mpKsProps = new Properties()
if (mpKsPropsFile.exists()) {
    mpKsPropsFile.withInputStream { mpKsProps.load(it) }
}
def mpStoreFileName = (mpKsProps.getProperty('storeFile') ?: 'mp-release-key.jks').trim()
def mpStorePass     = (mpKsProps.getProperty('storePassword') ?: System.getenv('MP_KEYSTORE_PASSWORD') ?: '').trim()
def mpKeyAlias      = (mpKsProps.getProperty('keyAlias') ?: 'mp-release').trim()
def mpKeyPass       = (mpKsProps.getProperty('keyPassword') ?: System.getenv('MP_KEY_PASSWORD') ?: '').trim()

android {
    namespace "com.partenaire.monpartenaire"
    compileSdk rootProject.ext.compileSdkVersion
    // MP-16KB-DROP-SQLITE: the bundle now ships ZERO native libraries — the only
    // .so was the prebuilt (4 KB-aligned) libsqlcipher.so from
    // @capacitor-community/sqlite, which was removed (queue moved to IndexedDB).
    // With no .so at all, the 16 KB page-size requirement is met by construction.
    // NDK r27 is retained only so the toolchain stays 16 KB-ready if native code
    // is ever added again.
    ndkVersion "27.3.13750724"
    defaultConfig {
        applicationId "com.partenaire.monpartenaire"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // MP-PLAY-CONSOLE-INITIAL-RELEASE: versionCode MUST monotonically
        // increase for every Play Console upload (the store rejects
        // duplicates). versionName is the human-facing semver visible
        // in About / Play Store. Bump versionCode by +1 every release;
        // bump versionName per semver rules.
        versionCode 109
        versionName "2.3.1"
        // MP-DEBUG-SIDE-BY-SIDE: AndroidManifest.xml uses android:label="${appLabel}".
        // This default reproduces the previous literal exactly, so every normal
        // build is unchanged; the debug buildType overrides it only under
        // -PmpDebugSuffix. Defined here (not only in the buildType) so the
        // placeholder can never be missing and fail manifest merging.
        manifestPlaceholders = [appLabel: "@string/app_name"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // MP-PLAY-CONSOLE-INITIAL-RELEASE: signing config for the signed
    // App Bundle (.aab). The keystore lives OUTSIDE the repo at
    // android/mp-release-key.jks (not committed; see .gitignore).
    // Credentials are resolved above (mp* vars) from android/keystore.properties
    // (preferred, gitignored) or the MP_* env vars as a fallback — never
    // hardcoded in source. storeFile resolves relative to the android/ root.
    signingConfigs {
        release {
            storeFile rootProject.file(mpStoreFileName)
            storePassword mpStorePass
            keyAlias mpKeyAlias
            keyPassword mpKeyPass
        }
    }
    buildTypes {
        // MP-DEBUG-SIDE-BY-SIDE: opt-in ONLY, via -PmpDebugSuffix. Without the
        // property this block is inert and the debug build is exactly what it is
        // today, so the release path is untouched.
        //
        // With it, the debug APK becomes com.partenaire.monpartenaire.debug and
        // installs ALONGSIDE the Play/release build instead of demanding an
        // uninstall — which would cost the tester their login and any queued
        // offline sales. Use it when a fix has to be verified on the same device
        // that carries real data:
        //
        //     ./gradlew assembleDebug -PmpDebugSuffix
        //
        // ⚠️ PUSH IS DISABLED IN THAT BUILD. google-services.json registers only
        // com.partenaire.monpartenaire, so the google-services plugin would fail
        // the build ("No matching client found") on the suffixed applicationId.
        // The apply at the bottom of this file is gated on the same property and
        // skips the plugin. That is fine for UI verification and NOT fine for
        // testing FCM — for push work, build without the flag and uninstall first.
        //
        // ⚠️ Do NOT pass this flag to assembleRelease/bundleRelease: the gate is
        // project-wide, so it would strip google-services from a shippable
        // artifact. Debug only.
        debug {
            if (project.hasProperty('mpDebugSuffix')) {
                applicationIdSuffix ".debug"
                versionNameSuffix "-debug"
                // Both apps otherwise install as "Stenamo" with the same icon —
                // two identical launcher entries is exactly the confusion that
                // wastes ten minutes at the wrong moment when the tester has the
                // Play build and the test build side by side.
                manifestPlaceholders = [appLabel: "Stenamo DEBUG"]
            }
        }
        release {
            // MP-R8-LEFT-OFF: minification/obfuscation stays DISABLED. Enabling R8
            // would clear the Play "no deobfuscation file" warning (informational,
            // no user impact) but risks stripping classes the Capacitor bridge and
            // the Bluetooth ESC/POS printer reach via reflection/JNI — and we can't
            // verify printing on a device here. Not worth risking the printer.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            // MP-NATIVE-DEBUG-SYMBOLS (Fix #2): request native debug symbols in the
            // AAB so Play can symbolicate native crashes. Since MP-16KB-DROP-SQLITE
            // the bundle ships NO native libs, so extraction is a no-op and the Play
            // "no debug symbols" note no longer applies. Config kept: correct + it
            // auto-activates if a symbol-carrying lib is ever added.
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// MP-DEBUG-SIDE-BY-SIDE: skip the plugin when -PmpDebugSuffix is active. The
// suffixed applicationId (…​.monpartenaire.debug) has no matching client in
// google-services.json, and the plugin hard-fails the build rather than warning.
// Push is intentionally dead in that build — see the debug buildType above.
try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text && !project.hasProperty('mpDebugSuffix')) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
