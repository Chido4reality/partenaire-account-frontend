apply plugin: 'com.android.application'

// MP-SIGNING-PROPS: resolve release-signing credentials from
// android/keystore.properties (gitignored) when present, falling back to the
// MP_KEYSTORE_PASSWORD / MP_KEY_PASSWORD env vars. This removes the dependency
// on pasted shell commands — Git Bash bracketed-paste artifacts (^[[200~) were
// corrupting the env-var exports, so passwords arrived null and
// :app:signReleaseBundle NPE'd at FinalizeBundleTask. Every value coalesces to
// "" so a null can never reach the signer (missing/empty → clear "keystore
// password was incorrect", not a NullPointerException).
def mpKsPropsFile = rootProject.file('keystore.properties')
def mpKsProps = new Properties()
if (mpKsPropsFile.exists()) {
    mpKsPropsFile.withInputStream { mpKsProps.load(it) }
}
def mpStoreFileName = (mpKsProps.getProperty('storeFile') ?: 'mp-release-key.jks').trim()
def mpStorePass     = (mpKsProps.getProperty('storePassword') ?: System.getenv('MP_KEYSTORE_PASSWORD') ?: '').trim()
def mpKeyAlias      = (mpKsProps.getProperty('keyAlias') ?: 'mp-release').trim()
def mpKeyPass       = (mpKsProps.getProperty('keyPassword') ?: System.getenv('MP_KEY_PASSWORD') ?: '').trim()

android {
    namespace "com.partenaire.monpartenaire"
    compileSdk rootProject.ext.compileSdkVersion
    // MP-16KB-DROP-SQLITE: the bundle now ships ZERO native libraries — the only
    // .so was the prebuilt (4 KB-aligned) libsqlcipher.so from
    // @capacitor-community/sqlite, which was removed (queue moved to IndexedDB).
    // With no .so at all, the 16 KB page-size requirement is met by construction.
    // NDK r27 is retained only so the toolchain stays 16 KB-ready if native code
    // is ever added again.
    ndkVersion "27.3.13750724"
    defaultConfig {
        applicationId "com.partenaire.monpartenaire"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // MP-PLAY-CONSOLE-INITIAL-RELEASE: versionCode MUST monotonically
        // increase for every Play Console upload (the store rejects
        // duplicates). versionName is the human-facing semver visible
        // in About / Play Store. Bump versionCode by +1 every release;
        // bump versionName per semver rules.
        // Bumped for the launch-gate release. vc109 artefacts already exist
        // (StenamoBusiness-2.3.1-vc109.apk, Stenamo-open-shift-fix-vc109.apk), and
        // whether any of them reached the Play Console cannot be determined from
        // this repo — so 109 is treated as SPENT. Skipping a number costs nothing;
        // colliding costs a rejected upload.
        versionCode 110
        versionName "2.3.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // MP-PLAY-CONSOLE-INITIAL-RELEASE: signing config for the signed
    // App Bundle (.aab). The keystore lives OUTSIDE the repo at
    // android/mp-release-key.jks (not committed; see .gitignore).
    // Credentials are resolved above (mp* vars) from android/keystore.properties
    // (preferred, gitignored) or the MP_* env vars as a fallback — never
    // hardcoded in source. storeFile resolves relative to the android/ root.
    signingConfigs {
        release {
            storeFile rootProject.file(mpStoreFileName)
            storePassword mpStorePass
            keyAlias mpKeyAlias
            keyPassword mpKeyPass
        }
    }
    buildTypes {
        release {
            // MP-R8-LEFT-OFF: minification/obfuscation stays DISABLED. Enabling R8
            // would clear the Play "no deobfuscation file" warning (informational,
            // no user impact) but risks stripping classes the Capacitor bridge and
            // the Bluetooth ESC/POS printer reach via reflection/JNI — and we can't
            // verify printing on a device here. Not worth risking the printer.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            // MP-NATIVE-DEBUG-SYMBOLS (Fix #2): request native debug symbols in the
            // AAB so Play can symbolicate native crashes. Since MP-16KB-DROP-SQLITE
            // the bundle ships NO native libs, so extraction is a no-op and the Play
            // "no debug symbols" note no longer applies. Config kept: correct + it
            // auto-activates if a symbol-carrying lib is ever added.
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// ── MP-PUSH-CONFIG-ASSERT ─────────────────────────────────────────────────────
// WHY THIS EXISTS. On 2026-08-15 a debug APK was built with the google-services
// plugin gated off (to allow an applicationIdSuffix). The build SUCCEEDED. The APK
// installed, launched, and let the user sign in. Then it killed the process, and
// kept killing it on every launch, because:
//
//   no google-services plugin  ->  no google_app_id resource
//   no google_app_id           ->  FirebaseInitProvider cannot init a default app
//   PushNotificationsPlugin.register() calls FirebaseMessaging.getInstance()
//     SYNCHRONOUSLY on its first line -> IllegalStateException
//   Capacitor Bridge.java catches it and does `throw new RuntimeException(ex)`
//     from inside a Runnable posted to a Handler -> uncaught -> process death
//
// Nothing upstream of the artefact showed a problem: gradle was green, the merged
// manifest was correct, and an artefact check confirmed the config was ABSENT —
// which was read as "push disabled" rather than "push fatal". Shipping the code
// that needs a config while removing the config is not disabling a feature; it
// arms a crash.
//
// ⚠️ THIS ASSERTS ON THE PACKAGED ARTEFACT, DELIBERATELY. Not on source, not on a
// gradle property, not on the presence of google-services.json, and not on whether
// the plugin was applied. Every one of those was fine in the build that shipped the
// crash. The only check that could not have passed is one that opens the .apk/.aab
// that is actually about to be installed and looks at what is really inside it.
//
// It reads two things out of the shipped file:
//   1. classes*.dex  -> does this artefact CONTAIN the push plugin?
//   2. resources.arsc -> does this artefact CONTAIN google_app_id?
// Push present + config absent = fail the build. Anything else passes, including
// an artefact with no push plugin at all (so a future build that genuinely drops
// push is not blocked by this).
//
// Verified by deliberately breaking it: with google-services.json moved aside the
// build FAILS here; restored, it passes. A checker that has never been seen to
// fire is not a checker.

/** True if `needle` appears in `bytes` as UTF-8/ASCII or as UTF-16LE. */
def mpBytesContain = { byte[] bytes, String needle ->
    // ISO-8859-1 is byte-preserving, so this is a byte search, not a text search.
    def hay = new String(bytes, "ISO-8859-1")
    if (hay.contains(needle)) return true
    def utf16le = new StringBuilder()
    needle.each { ch -> utf16le.append(ch).append('␀') }
    return hay.contains(utf16le.toString())
}

def mpAssertPushConfig = { File artefact ->
    if (artefact == null || !artefact.isFile()) return
    def name = artefact.name
    if (!(name.endsWith('.apk') || name.endsWith('.aab'))) return

    def zip = new java.util.zip.ZipFile(artefact)
    try {
        boolean hasPushCode = false
        boolean hasFirebaseConfig = false

        for (entry in zip.entries()) {
            def en = entry.name
            // Dex lives at the root in an APK and under base/dex/ in an AAB.
            def isDex = en.endsWith('.dex')
            // resources.arsc in an APK; an AAB keeps resources in protobuf
            // (resources.pb) plus the raw values, so scan both shapes.
            def isRes = en.endsWith('resources.arsc') || en.endsWith('resources.pb')
            if (!isDex && !isRes) continue

            def bytes = zip.getInputStream(entry).bytes
            if (isDex && !hasPushCode) {
                hasPushCode = mpBytesContain(bytes, 'PushNotificationsPlugin')
            }
            if (isRes && !hasFirebaseConfig) {
                hasFirebaseConfig = mpBytesContain(bytes, 'google_app_id')
            }
            if (hasPushCode && hasFirebaseConfig) break
        }

        if (hasPushCode && !hasFirebaseConfig) {
            throw new GradleException(
                "\n" +
                "╔══════════════════════════════════════════════════════════════════════╗\n" +
                "║  MP-PUSH-CONFIG-ASSERT — THIS ARTEFACT WOULD CRASH ON EVERY LAUNCH   ║\n" +
                "╚══════════════════════════════════════════════════════════════════════╝\n" +
                "  ${artefact.name}\n" +
                "  ${artefact.absolutePath}\n\n" +
                "  It CONTAINS the Capacitor push plugin but has NO google_app_id\n" +
                "  resource, so there is no default FirebaseApp at runtime.\n\n" +
                "  PushNotificationsPlugin.register() calls FirebaseMessaging.getInstance()\n" +
                "  synchronously; with no default app that throws IllegalStateException,\n" +
                "  and Capacitor's Bridge rethrows it as a RuntimeException from a posted\n" +
                "  Runnable — which kills the process. It will die right after the user\n" +
                "  grants the notification permission, then on every launch after that.\n" +
                "  No JS try/catch or timeout can intercept it.\n\n" +
                "  This is almost always caused by the google-services plugin not being\n" +
                "  applied (missing/empty android/app/google-services.json, or an\n" +
                "  applicationId with no matching client in it).\n\n" +
                "  FIX: make the config real — do not remove the plugin to dodge the\n" +
                "  'No matching client found' error. If you need a suffixed applicationId,\n" +
                "  register that package as an ADDITIONAL client in the Firebase console.\n" +
                "  If you genuinely want a push-free build, remove @capacitor/push-notifications\n" +
                "  so the plugin's code is not in the artefact either.\n"
            )
        }

        logger.lifecycle("MP-PUSH-CONFIG-ASSERT: ${artefact.name} OK " +
            "(push plugin ${hasPushCode ? 'present' : 'absent'}, google_app_id ${hasFirebaseConfig ? 'present' : 'absent'})")
    } finally {
        zip.close()
    }
}

// Hook the packaging tasks themselves so the check runs the moment the artefact is
// written, for every variant, whether it was produced by assemble* or bundle*.
// Matched on type NAME rather than by importing AGP internals, which move between
// versions — a build that silently stopped being checked would be the worst outcome.
tasks.configureEach { t ->
    def cn = t.getClass().getName()
    if (cn.contains('PackageAndroidArtifact') || cn.contains('PackageApplication')
        || cn.contains('FinalizeBundleTask')) {
        t.doLast {
            def checked = 0
            t.outputs.files.each { f ->
                if (f.isDirectory()) {
                    f.eachFileRecurse { c ->
                        if (c.name.endsWith('.apk') || c.name.endsWith('.aab')) { mpAssertPushConfig(c); checked++ }
                    }
                } else if (f.name.endsWith('.apk') || f.name.endsWith('.aab')) {
                    mpAssertPushConfig(f); checked++
                }
            }
            if (checked == 0) {
                logger.warn("MP-PUSH-CONFIG-ASSERT: ${t.name} produced no .apk/.aab to check — " +
                    "if this is a packaging task, the assertion is no longer wired up. Fix it.")
            }
        }
    }
}
